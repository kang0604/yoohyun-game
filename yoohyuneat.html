<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이유현 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Dokdo&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --pen: #000000;
    --gray: #9a9a9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--paper);
    font-family: 'Gaegu', system-ui, sans-serif;
    color: var(--pen);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }

  .hud {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 30px;
    pointer-events: none; z-index: 3;
  }
  .stat { text-align: center; }
  .stat b {
    display: block; font-family: 'Dokdo', cursive; font-size: 40px;
    line-height: .95; color: #000; font-weight: 400;
    transform: rotate(-2deg);
  }
  .stat:nth-child(2) b { transform: rotate(2deg); }
  .stat span { font-size: 17px; color: #555; }

  .panel {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 22px; text-align: center;
    background: rgba(255,255,255,.94);
  }
  .panel.hidden { display: none; }

  .panel h1 {
    font-family: 'Dokdo', cursive; font-weight: 400;
    font-size: clamp(52px, 15vw, 92px); line-height: .9;
    color: #000; transform: rotate(-3deg);
    text-shadow: 3px 3px 0 #ffe400, 6px 6px 0 #ff2d2d;
  }
  .panel h2 {
    font-family: 'Dokdo', cursive; font-weight: 400;
    font-size: clamp(44px, 13vw, 74px); color: #ff2d2d;
    transform: rotate(2deg); text-shadow: 3px 3px 0 #000;
  }
  .panel p { max-width: 21em; font-size: 21px; line-height: 1.5; color: #333; }
  .panel .final { font-family: 'Dokdo', cursive; font-size: 30px; color: #000; }
  .panel .final em { font-style: normal; font-size: 52px; color: #ff2d2d; }

  .hero {
    position: relative; width: min(78vw, 340px);
    border: 3px solid #000; box-shadow: 7px 7px 0 #000;
    transform: rotate(-1.5deg); overflow: hidden; background: #000;
  }
  .hero img { width: 100%; display: block; }
  .hero h1 {
    position: absolute; left: 0; right: 0; bottom: 2px;
    font-size: clamp(46px, 13vw, 74px); line-height: .82;
    transform: rotate(1.5deg);
    color: #ffe400;
    -webkit-text-stroke: 5px #000; paint-order: stroke fill;
    text-shadow: none;
  }

  .mouth {
    width: min(78vw, 340px);
    border: 3px solid #000; box-shadow: 6px 6px 0 #000;
    transform: rotate(1.5deg); overflow: hidden; background: #000;
    margin-top: 2px;
  }
  .mouth img { width: 100%; display: block; }

  .soundbtn {
    position: absolute; top: 12px; right: 12px; z-index: 8;
    font-size: 22px; padding: 2px 10px 6px;
    border: 3px solid #000; border-radius: 4px;
    background: #fff; box-shadow: 3px 3px 0 #000;
    transform: rotate(2deg); cursor: pointer; line-height: 1.2;
  }
  .soundbtn.off { background: #ddd; color: #888; }
  .soundbtn:active { transform: translate(3px,3px) rotate(2deg); box-shadow: 0 0 0 #000; }

  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: 'Dokdo', cursive; font-size: 30px; padding: 6px 30px 10px;
    border: 3px solid #000; border-radius: 4px;
    background: #ffe400; color: #000; cursor: pointer;
    box-shadow: 4px 4px 0 #000;
    transform: rotate(-1deg);
  }
  button.ghost { background: #fff; transform: rotate(1.5deg); }
  button:active { transform: translate(4px,4px) rotate(-1deg); box-shadow: 0 0 0 #000; }
  button:focus-visible { outline: 3px dashed #ff2d2d; outline-offset: 3px; }
  .hint { font-size: 18px; color: #888; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <button id="soundBtn" class="soundbtn" aria-label="소리 켜기 끄기">🔊</button>

  <div class="hud">
    <div class="stat"><b id="score">60</b><span>몸무게</span></div>
    <div class="stat"><b id="size">0</b><span>먹은 끼니</span></div>
    <div class="stat"><b id="best">60</b><span>최대 몸무게</span></div>
  </div>

  <div class="panel" id="titlePanel">
    <div class="hero">
      <img id="heroImg" alt="이유현">
      <h1>이유현<br>키우기</h1>
    </div>
    <p>날아오는 거 중에 먹을 수 있는 것만 드세요.<br>먹을수록 뚱뚱해지고 느려집니다.<br>먹을 수 없는 걸 먹으면 체합니다.</p>
    <button id="startBtn">시작</button>
    <p class="hint">방향키 · 폰은 화면 끌기</p>
    <div class="mouth"><img id="mouthImg" alt=""></div>
  </div>

  <div class="panel hidden" id="overPanel">
    <h2>체함</h2>
    <p id="deathMsg"></p>
    <p class="final">몸무게 <em id="finalScore">0</em>kg</p>
    <div class="btnrow">
      <button id="retryBtn">다시</button>
      <button id="homeBtn" class="ghost">홈으로</button>
    </div>
  </div>
</div>

  function withTopic(word){
    const last = word.charCodeAt(word.length - 1) - 0xac00;

    return word + (hasBatchim ? '은' : '는');

  // ── 소리 (파일 없이 웹오디오로 합성)
  let audioCtx = null, soundOn = true;
  function ac(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // 쿰척쿰척 — 저음 '쿰' + 바스락 '척' 두 번
  function sfxChomp(){
    if(!soundOn) return;
    const c = ac(), t0 = c.currentTime;
    for(let k=0;k<2;k++){
      const t = t0 + k*0.115;
      const len = Math.floor(c.sampleRate*0.10);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 1.7);
      const src = c.createBufferSource(); src.buffer = buf;
      const bp = c.createBiquadFilter();
      bp.type='bandpass'; bp.frequency.value = 460 + k*160; bp.Q.value = 1.1;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.45, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.10);
      src.connect(bp).connect(g).connect(c.destination);
      src.start(t); src.stop(t+0.11);

      const o = c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(165 - k*20, t);
      o.frequency.exponentialRampToValueAtTime(72, t+0.09);
      const og = c.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.30, t+0.010);
      og.gain.exponentialRampToValueAtTime(0.0001, t+0.10);
      o.connect(og).connect(c.destination);
      o.start(t); o.stop(t+0.11);
    }
  }

  // 돼지 비명 — 거친 톱니파에 빠른 비브라토
  function sfxSqueal(){
    if(!soundOn) return;
    const c = ac(), t = c.currentTime, dur = 0.5;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(1500, t+0.10);
    o.frequency.exponentialRampToValueAtTime(1050, t+0.30);
    o.frequency.exponentialRampToValueAtTime(260, t+dur);

    const lfo = c.createOscillator(); lfo.type='sine'; lfo.frequency.value = 30;
    const lg = c.createGain(); lg.gain.value = 160;
    lfo.connect(lg).connect(o.frequency);
    lfo.start(t); lfo.stop(t+dur);

    const ws = c.createWaveShaper();
    const curve = new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x = i/512 - 1; curve[i] = Math.tanh(x*4.5); }
    ws.curve = curve;

    const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.30, t+0.03);
    g.gain.setValueAtTime(0.30, t+0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);

    o.connect(ws).connect(hp).connect(g).connect(c.destination);
    o.start(t); o.stop(t+dur);
  }

  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');

  const BASE_WEIGHT=60;
  let W=0,H=0,cx=0,cy=0,arenaR=0;
  let state='title', best=BASE_WEIGHT;
  const player={x:0,y:0,r:24,speed:245,mouth:0,wob:0};
  const keys=Object.create(null);

  // 손으로 그린 듯 삐뚤빼뚤한 원 (매 프레임 바뀌지 않게 고정 시드)
  let wobbleSeed=[];
  function makeWobble(){
    wobbleSeed=[];
    for(let i=0;i<46;i++) wobbleSeed.push((Math.random()-0.5)*9);
  }
  makeWobble();

  function roughCircle(x,y,r,seedOffset){
    ctx.beginPath();
    const n=wobbleSeed.length;
    for(let i=0;i<=n;i++){
      const a=(i%n)/n*Math.PI*2;
      const rr=r+wobbleSeed[(i+seedOffset)%n];
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function resize(){
    const stage=document.getElementById('stage');
    W=stage.clientWidth; H=stage.clientHeight;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2; cy=H/2+16; arenaR=Math.min(W,H)*0.42;
  }
  window.addEventListener('resize',resize); resize();

  function reset(){
    player.x=cx; player.y=cy; player.r=24; player.mouth=0;
    items=[]; sparks=[]; score=BASE_WEIGHT; eaten=0; elapsed=0; spawnTimer=0;
    makeWobble(); updateHud();
  }
  function updateHud(){ scoreEl.textContent=score; sizeEl.textContent=eaten; bestEl.textContent=best; }

  function spawn(){
    const junkRatio=Math.min(0.24+elapsed*0.012,0.55);
    const isJunk=Math.random()<junkRatio;
    const a=Math.random()*Math.PI*2, sR=arenaR+90;
    const x=cx+Math.cos(a)*sR, y=cy+Math.sin(a)*sR;
    const aimA=Math.random()*Math.PI*2, aimD=Math.random()*arenaR*0.75;
    const tx=cx+Math.cos(aimA)*aimD, ty=cy+Math.sin(aimA)*aimD;
    const dx=tx-x, dy=ty-y, len=Math.hypot(dx,dy)||1;
    const sp=105+Math.random()*55+elapsed*3.4;
    items.push({
      x,y,vx:(dx/len)*sp,vy:(dy/len)*sp,
      r:isJunk?27:25, junk:isJunk,
      key: isJunk?JUNK[(Math.random()*JUNK.length)|0]:FOOD[(Math.random()*FOOD.length)|0],
      rot:Math.random()*Math.PI*2, spin:(Math.random()-0.5)*2.6
    });
  }

  function burst(x,y,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=50+Math.random()*160;
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,max:.5});
    }
  }

  function gameOver(key){
    state='over'; best=Math.max(best,score);
    finalEl.textContent=score;
    deathMsgEl.textContent=deathLine(key);
    overPanel.classList.remove('hidden'); updateHud();
  }

  function update(dt){
    elapsed+=dt;
    let mx=0,my=0;
    if(keys['ArrowLeft']||keys['a']||keys['A']||keys['ㅁ']) mx-=1;
    if(keys['ArrowRight']||keys['d']||keys['D']||keys['ㅇ']) mx+=1;
    if(keys['ArrowUp']||keys['w']||keys['W']||keys['ㅈ']) my-=1;
    if(keys['ArrowDown']||keys['s']||keys['S']||keys['ㄴ']) my+=1;
    if(pointer.active){
      const dx=pointer.x-player.x, dy=pointer.y-player.y, d=Math.hypot(dx,dy);
      if(d>4){mx=dx/d; my=dy/d;}
    }
    const m=Math.hypot(mx,my);
    if(m>0){
      const slow=1-Math.min(eaten*0.011,0.34);
      player.x+=(mx/m)*player.speed*slow*dt;
      player.y+=(my/m)*player.speed*slow*dt;
      player.wob+=dt*9;
    }
    const dx=player.x-cx, dy=player.y-cy, dist=Math.hypot(dx,dy), lim=arenaR-player.r;
    if(dist>lim){ player.x=cx+(dx/dist)*lim; player.y=cy+(dy/dist)*lim; }
    player.mouth=Math.max(0,player.mouth-dt*3.2);

    spawnTimer-=dt;
    if(spawnTimer<=0){ spawn(); spawnTimer=Math.max(0.16,0.72-elapsed*0.018); }

    for(let i=items.length-1;i>=0;i--){
      const o=items[i];
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.rot+=o.spin*dt;
      if(Math.hypot(o.x-player.x,o.y-player.y) < player.r+o.r*0.6){
        if(o.junk){ burst(o.x,o.y,24); sfxSqueal(); gameOver(o.key); items.splice(i,1); return; }
        score+=10; eaten+=1;
        player.r=Math.min(24+eaten*1.15,72);
        player.mouth=1; burst(o.x,o.y,10); sfxChomp();
        items.splice(i,1); updateHud(); continue;
      }
      if(Math.hypot(o.x-cx,o.y-cy)>arenaR+160) items.splice(i,1);
    }
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=0.93; s.vy*=0.93; s.life-=dt;
      if(s.life<=0) sparks.splice(i,1);
    }
  }

  function drawPlayer(){
    const bounce = Math.sin(player.wob)*1.6;
    const r = player.r*(1+player.mouth*0.09);
    ctx.save();
    ctx.translate(player.x, player.y+bounce);
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
    if(faceReady) ctx.drawImage(face,-r,-r,r*2,r*2);
    else { ctx.fillStyle='#fc9'; ctx.fillRect(-r,-r,r*2,r*2); }
    ctx.restore();
    // 얇은 무채색 테두리
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.lineWidth=2; ctx.strokeStyle='#333'; ctx.stroke();
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

    // 노트 격자 배경
    ctx.strokeStyle='#eaeaea'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=28){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0;y<H;y+=28){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // 삐뚤빼뚤 아레나 바닥
    roughCircle(cx,cy,arenaR,0);
    ctx.fillStyle='#fdfdfd'; ctx.fill();

    ctx.save();
    roughCircle(cx,cy,arenaR,0); ctx.clip();

    // 대충 칠한 듯한 빗금
    ctx.strokeStyle='#f2f2f2'; ctx.lineWidth=6;
    for(let i=-arenaR*2;i<arenaR*2;i+=17){
      ctx.beginPath();
      ctx.moveTo(cx+i, cy-arenaR-10);
      ctx.lineTo(cx+i+arenaR*0.55, cy+arenaR+10);
      ctx.stroke();
    }

    // 물체
    for(const o of items){
      const im=imgs[o.key];
      ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.rot);
      if(im && im.complete && im.naturalWidth){
        ctx.drawImage(im,-o.r,-o.r,o.r*2,o.r*2);
      }
      ctx.restore();
      // 얇은 무채색 테두리만 (색으로 구분 안 함)
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r+3,0,Math.PI*2);
      ctx.lineWidth=1.5; ctx.strokeStyle='#8c8c8c'; ctx.stroke();
    }

    // 파티클 — 연필 낙서 같은 짧은 선
    ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.lineCap='round';
    for(const s of sparks){
      ctx.globalAlpha=Math.max(0,s.life/s.max);
      ctx.beginPath();
      ctx.moveTo(s.x,s.y);
      ctx.lineTo(s.x-s.vx*0.035,s.y-s.vy*0.035);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.restore();

    // 아레나 외곽선 — 두 번 그어 손그림 느낌
    ctx.strokeStyle='#000'; ctx.lineWidth=2.5;
    roughCircle(cx,cy,arenaR,0); ctx.stroke();
    ctx.globalAlpha=.45; ctx.lineWidth=1.5;
    roughCircle(cx,cy,arenaR-2,7); ctx.stroke();
    ctx.globalAlpha=1;

    if(state!=='title') drawPlayer();
  }

  function loop(t){
    const dt=Math.min((t-lastTime)/1000||0,0.05); lastTime=t;
    if(state==='playing') update(dt);
    render();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown',e=>{
    keys[e.key]=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup',e=>{keys[e.key]=false;});
  function pp(e){
    const rect=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
    pointer.x=p.clientX-rect.left; pointer.y=p.clientY-rect.top;
  }
  canvas.addEventListener('pointerdown',e=>{pointer.active=true; pp(e);});
  canvas.addEventListener('pointermove',e=>{if(pointer.active) pp(e);});
  window.addEventListener('pointerup',()=>{pointer.active=false;});
  window.addEventListener('pointercancel',()=>{pointer.active=false;});

  function start(){
    if(soundOn) ac();
    reset();
    titlePanel.classList.add('hidden'); overPanel.classList.add('hidden');
    state='playing';
  }
  function goHome(){
    state='title'; overPanel.classList.add('hidden'); titlePanel.classList.remove('hidden');
  }
  document.getElementById('startBtn').addEventListener('click',start);
  document.getElementById('retryBtn').addEventListener('click',start);
  document.getElementById('homeBtn').addEventListener('click',goHome);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
